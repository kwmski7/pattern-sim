[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pattern-sim"
version = "0.2.0"
description = "Learned pattern / location / scale / rotation / intensity similarity between two 2D fields"
requires-python = ">=3.9"
dependencies = ["torch>=2.3", "torchvision>=0.18", "numpy", "pillow>=9.1", "matplotlib", "tqdm", "pandas"]

[project.optional-dependencies]
era5 = ["xarray", "zarr>=3", "gcsfs"]

[tool.setuptools]
packages = ["patsim", "precipsim"]
